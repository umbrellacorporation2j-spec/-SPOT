<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SPOT | سبوت</title>
<meta name="theme-color" content="#060606">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#060606;--panel:#111113;--red:#e10600;--red2:#ff3026;--dred:#8b0000;--text:#fff;--muted:#a3a3ab;--line:#2b2b31;--slant:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);max-width:100%;overflow-x:hidden}
body{min-height:100vh;color:var(--text);font-family:'Readex Pro',Tahoma,sans-serif;overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom,0);background:radial-gradient(ellipse at 50% -10%,#e1060038,transparent 45%),var(--bg)}
body:before{content:"";position:fixed;inset:0 0 auto;height:280px;pointer-events:none;z-index:0;background:linear-gradient(115deg,#e1060050 0 10%,transparent 10% 13%,#e1060030 13% 19%,transparent 19% 21%,#e1060020 21% 24%,transparent 24%);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
[hidden]{display:none!important}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.wrap{position:relative;z-index:1;width:100%;max-width:980px;margin:auto;padding:0 14px 70px}
.wrap.leaving{animation:pageOut .45s ease-in both}
/* header */
header{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:12px;margin:0 -14px;padding:calc(12px + env(safe-area-inset-top,0)) 14px 12px;background:linear-gradient(#060606f2,#060606cc);backdrop-filter:blur(10px)}
header:after{content:"";position:absolute;bottom:0;inset-inline:0;height:3px;background:linear-gradient(115deg,var(--red) 0 30%,transparent 30% 34%,#fff5 34% 38%,transparent 38%)}
header:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,#ffffff30 50%,transparent 60%) no-repeat;background-size:260% 100%;animation:sweep 1.8s .3s 1 both}
@keyframes sweep{from{background-position:130% 0}to{background-position:-30% 0}}
.burger{width:46px;height:46px;border:1px solid #e1060088;background:linear-gradient(135deg,#2a0000,#141416);border-radius:13px;display:grid;place-content:center;gap:5px;cursor:pointer;flex:none;box-shadow:0 6px 20px #e1060033}
.burger i{display:block;width:21px;height:2.5px;border-radius:2px;background:#fff;transition:transform .4s var(--ease),opacity .25s,width .3s}
.burger i:nth-child(2){width:14px;margin-inline-start:auto}
.burger.open i:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
.burger.open i:nth-child(2){opacity:0;transform:scaleX(0)}
.burger.open i:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
.brand{display:flex;align-items:center;gap:10px;flex:1;animation:rise .7s var(--ease) both}
.brand img{width:44px;height:44px;border-radius:13px;box-shadow:0 0 0 1px #e1060088,0 7px 22px #e1060055}
.brand b{font-size:23px;line-height:1;display:block}.brand em{color:var(--red2);font-size:11px;font-style:normal;letter-spacing:.27em;font-weight:700}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--red2),#430000);display:grid;place-items:center;font-weight:700;border:0;color:#fff;cursor:pointer;font-family:inherit;animation:rise .7s .1s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
/* drawer */
#scrim{position:fixed;inset:0;z-index:40;background:#000b;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .4s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;z-index:41;top:0;bottom:0;right:0;width:min(85vw,340px);display:flex;flex-direction:column;overflow-y:auto;padding:env(safe-area-inset-top,0) 0 calc(14px + env(safe-area-inset-bottom,0));background:linear-gradient(115deg,#e1060030 0 12%,transparent 12% 15%,#e1060018 15% 22%,transparent 22%),linear-gradient(170deg,#1f0000,#0b0b0c 45%);border-inline-start:1px solid #e1060088;box-shadow:-24px 0 80px #e1060040;transform:translateX(106%);transition:transform .55s var(--ease)}
#drawer.on{transform:none}
#drawer:before{content:"";position:absolute;top:0;left:0;width:110px;height:110px;background:linear-gradient(135deg,var(--red),var(--dred));clip-path:polygon(0 0,100% 0,0 100%);pointer-events:none}
.dr-head{position:relative;display:flex;align-items:center;gap:12px;padding:26px 20px 14px 20px}
.dr-head img{width:58px;height:58px;border-radius:16px;box-shadow:0 0 0 1px #e1060099,0 8px 26px #e1060066}
.dr-head b{font-size:22px;display:block;line-height:1}.dr-head em{font-style:normal;font-size:11px;letter-spacing:.27em;color:var(--red2);font-weight:700}
.dr-head small{display:block;color:var(--muted);font-size:11px;margin-top:5px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-label{margin:14px 22px 6px;font-size:11px;color:var(--muted);letter-spacing:.12em;display:flex;align-items:center;gap:8px}
.dr-label:before{content:"";width:16px;height:8px;background:var(--red);clip-path:var(--slant)}
.dr-nav{display:flex;flex-direction:column}
.dr-item{display:flex;align-items:center;gap:13px;margin:2px 12px;padding:9px 10px;border:0;border-radius:13px;background:transparent;color:#d8d8dd;font:500 15px 'Readex Pro',Tahoma,sans-serif;cursor:pointer;text-align:start;position:relative;opacity:0;transform:translateX(80px);transition:transform .5s var(--ease),opacity .35s,background .25s,color .25s}
#drawer.on .dr-item{opacity:1;transform:none;transition-delay:calc(var(--i)*45ms + 140ms),calc(var(--i)*45ms + 140ms),0s,0s}
.dr-item .ico{width:40px;height:40px;display:grid;place-items:center;background:#1c1c20;clip-path:var(--slant);font-size:19px;transition:background .25s}
.dr-item .lbl{flex:1}
.dr-item:hover{background:#ffffff0a}
.dr-item.active{background:linear-gradient(100deg,#e1060050,#e1060008);color:#fff}
.dr-item.active .ico{background:linear-gradient(135deg,var(--red2),var(--dred))}
.dr-item.active:after{content:"";position:absolute;inset-block:8px;inset-inline-start:-12px;width:6px;background:var(--red);transform:skewX(-14deg);border-radius:2px}
.cnt{min-width:24px;padding:2px 8px;border-radius:20px;background:#ffffff14;font-size:11px;text-align:center}.cnt:empty{display:none}
.dr-foot{margin:auto 22px 0;padding-top:20px;font-size:11px;color:var(--muted)}
/* player */
#player{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s var(--ease),opacity .4s,margin .4s;margin-top:14px}
#player.min{grid-template-rows:0fr;opacity:0;margin-top:0}
#player>div{overflow:hidden;min-height:0;padding:0 1px}
.stage{position:relative;aspect-ratio:16/9;background:#000;border:1px solid #e1060099;border-radius:16px;overflow:hidden;box-shadow:0 18px 55px #e1060030,0 0 90px #e106001a}
.stage:after{content:"";position:absolute;bottom:0;inset-inline-start:0;width:42%;height:5px;background:linear-gradient(115deg,var(--red),var(--dred) 80%,transparent 80%);pointer-events:none;z-index:2}
.stage:before{content:"";position:absolute;top:0;inset-inline-end:0;width:34%;height:5px;background:linear-gradient(245deg,var(--red),var(--dred) 80%,transparent 80%);pointer-events:none;z-index:2}
.stage video,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px;font-size:14px;background:radial-gradient(ellipse at 50% 25%,#e1060030,transparent 62%),#090000}
.empty img{width:min(30%,130px);border-radius:22px;box-shadow:0 0 50px #e1060060}
.now{display:flex;gap:10px;align-items:center;min-height:60px;padding:12px 4px}
.now.swap>*{animation:rise .5s var(--ease) both}
.now b{font-size:17px}.now small{color:var(--muted);font-size:12px}.muted{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--red2),#8b0000);padding:4px 12px;clip-path:var(--slant);font-size:11px;font-weight:700;white-space:nowrap;flex:none}
.tag:before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}@keyframes pulse{50%{opacity:.25}}
/* buttons */
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--red2),var(--red) 55%,#850000);font:700 13px 'Readex Pro',Tahoma,sans-serif;padding:11px 20px;clip-path:var(--slant);transition:transform .22s,filter .22s}
.btn:hover{transform:translateX(-5px) skewX(-3deg);filter:brightness(1.18)}.btn:active{transform:scale(.96)}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,#fff7 50%,transparent 65%);transform:translateX(-130%);transition:transform .65s}.btn:hover:after,.btn:active:after{transform:translateX(130%)}
.btn.ghost{background:linear-gradient(135deg,#303035,#17171a)}.btn.big{font-size:15px;padding:14px 32px;box-shadow:0 10px 34px #e1060055}
.btn:focus-visible,.item:focus-visible,input:focus-visible,.dr-item:focus-visible,.burger:focus-visible{outline:2px solid #fff;outline-offset:2px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px;padding:9px}
/* pages */
.page{animation:pageIn .6s var(--ease) both}.page.out{animation:pageOut .26s ease-in both}
.page>*{animation:rise .6s var(--ease) both}.page>*:nth-child(2){animation-delay:.06s}.page>*:nth-child(3){animation-delay:.12s}.page>*:nth-child(4){animation-delay:.18s}.page>*:nth-child(5){animation-delay:.24s}
@keyframes pageIn{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:none}}
@keyframes pageOut{to{opacity:0;transform:translateX(-70px)}}
h2{display:flex;align-items:center;gap:9px;font-size:16px;margin:18px 0 10px}
h2:before{content:"";width:22px;height:12px;background:var(--red);clip-path:var(--slant);flex:none}
h2:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}
.cntb{font-size:11px;color:var(--muted);font-weight:400}
.addbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0 4px}
.addbar:before,.addbar:after{content:"";flex:1;height:10px;background:repeating-linear-gradient(115deg,var(--red) 0 6px,transparent 6px 14px);opacity:.75;-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.addbar:after{transform:scaleX(-1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;color:var(--muted);background:#1b1b1e;font:500 13px 'Readex Pro',Tahoma,sans-serif;padding:9px 20px;clip-path:var(--slant);cursor:pointer;transition:background .25s,color .25s}
.chip.active{color:#fff;background:linear-gradient(135deg,var(--red2),var(--dred))}
.search{margin-bottom:10px}
.list{display:grid;gap:10px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}.list .emptylist{grid-column:1/-1}}
.emptylist{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.note{font-size:12px;color:var(--muted);line-height:1.9;margin-top:22px;padding:12px 14px;border-inline-start:3px solid var(--red);background:#ffffff08;border-radius:6px}
/* stream cards */
.item{position:relative;display:flex;align-items:center;gap:11px;min-height:84px;padding:10px 18px 10px 10px;overflow:hidden;background:linear-gradient(100deg,#230000,#111113 40%);border:1px solid var(--line);border-radius:13px;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.item:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:8px;background:linear-gradient(var(--red),var(--dred));transform:skewX(-16deg);transform-origin:top;transition:width .25s}
.item:hover{transform:translateX(-5px);border-color:#e10600aa}.item:active{transform:translateX(-4px) skewX(-2deg)}
.item.current{border-color:var(--red);box-shadow:0 0 24px #e1060040}.item.current:before{width:14px}
.item.in{animation:itemIn .6s var(--ease) both}.item.gone{animation:itemOut .35s ease-in both;pointer-events:none}
@keyframes itemIn{from{opacity:0;transform:translateX(60px) skewX(-8deg)}to{opacity:1;transform:none}}
@keyframes itemOut{to{opacity:0;transform:translateX(-80px) skewX(8deg);max-height:0}}
.th{position:relative;flex:none;width:96px;aspect-ratio:16/9;margin-inline-start:8px;border-radius:9px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#5a0000,#0a0000);border:1px solid #e1060066;display:grid;place-items:center;color:#ffffffcc}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.th .tag{position:absolute;top:4px;inset-inline-start:4px;font-size:8px;padding:2px 8px}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item .t span{font-size:11px;color:var(--muted)}
.mini{border:0;background:transparent;color:#8d8d94;cursor:pointer;font-size:19px;padding:6px;transition:.2s}
.mini:hover{color:#ffcf00;transform:translateX(-3px) scale(1.15)}.mini.on{color:#ffd000}.mini.on .ic{fill:currentColor}.mini.del:hover{color:var(--red2)}
/* match cards */
.mcard{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 18px 12px;overflow:hidden;cursor:pointer;background:linear-gradient(100deg,#230000,#111113 45%);border:1px solid var(--line);border-radius:14px;transition:border-color .25s}
.mcard:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:7px;background:linear-gradient(var(--red),var(--dred));transform:skewX(-16deg);transform-origin:top}
.mcard.in{animation:itemIn .6s var(--ease) both}.mcard.open{border-color:var(--red)}
.tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;font-weight:500;min-width:0}
.tm img{width:40px;height:40px;object-fit:contain}.tm .ph{width:40px;height:40px;border-radius:50%;background:#222;display:grid;place-items:center;color:var(--muted)}
.sc{text-align:center}.sc strong{display:block;font-size:22px;letter-spacing:2px}.sc small{display:block;font-size:10px;color:var(--muted);margin-top:3px;max-width:90px}
.more{grid-column:1/-1;max-height:0;overflow:hidden;font-size:12px;color:var(--muted);text-align:center;line-height:1.9;transition:max-height .45s var(--ease),padding .3s}
.mcard.open .more{max-height:130px;padding-top:10px}
.sk{height:92px;border-radius:14px;background:linear-gradient(110deg,#141416 30%,#26262a 50%,#141416 70%);background-size:300% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-300% 0}}
/* help */
.guide{display:grid;gap:10px}
.gstep{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(100deg,#230000,#111113 45%);position:relative;overflow:hidden}
.gstep:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:var(--red);transform:skewX(-16deg)}
.gstep>b{flex:none;width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(135deg,var(--red2),var(--dred));clip-path:var(--slant);font-size:15px}
.gstep h3{font-size:14px;margin-bottom:4px}.gstep p{font-size:12.5px;color:#c9c9cf;line-height:1.9}.gstep code{background:#000;border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:11px;direction:ltr;display:inline-block}
/* dialogs */
dialog{margin:auto;width:min(470px,92vw);max-height:90vh;overflow:auto;border:1px solid #e10600aa;border-radius:20px;padding:22px;background:linear-gradient(115deg,#e1060033 0 7%,transparent 7% 9%,#e106001f 9% 13%,transparent 13%),linear-gradient(160deg,#200000,#0e0e10 50%);color:#fff;box-shadow:0 0 90px #e106005a}
dialog[open]{animation:modalIn .5s var(--ease) both}dialog[open]::backdrop{background:#000d;backdrop-filter:blur(3px);animation:fadeIn .35s both}
dialog.out{animation:modalOut .24s ease-in both!important}dialog.out::backdrop{animation:fadeOut .24s both}
@keyframes modalIn{from{opacity:0;transform:translateY(90px) skewY(2deg) scale(.94)}to{opacity:1;transform:none}}@keyframes modalOut{to{opacity:0;transform:translateY(60px) scale(.96)}}@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
dialog b.ttl{font-size:18px}.tabs2{display:flex;gap:8px;margin:14px 0 2px}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}
input,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#050505;color:#fff;font:inherit;font-size:16px;direction:ltr;text-align:start}
textarea{resize:vertical}input.rtl{direction:rtl}input:focus,textarea:focus{outline:2px solid #e1060066;border-color:var(--red)}
.row{display:flex;gap:8px;margin-top:16px;align-items:center}.row input{margin:0}
.pv{position:relative;width:min(230px,72%);aspect-ratio:16/9;margin:12px auto 0;border-radius:11px;overflow:hidden;background:#000;border:1px solid #e1060077;display:grid;place-items:center;animation:rise .4s var(--ease) both}
.pv video,.pv img,.pv iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.pvmsg{padding:10px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7}
.member{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}.member strong{font-size:13px}.member small{display:block;color:var(--muted);font-size:11px}
.code{background:#050505;border:1px dashed var(--red);border-radius:10px;padding:12px;text-align:center;font-size:20px;letter-spacing:4px;margin:12px 0}
/* login */
.login{position:fixed;z-index:60;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;background:radial-gradient(ellipse at 50% 0,#e1060055,transparent 55%),#000;animation:loginIn .7s var(--ease) both}
.login:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,#c4000055 0 10%,transparent 10% 12%,#e1060033 12% 18%,transparent 18% 19.5%,#e106001f 19.5% 22%,transparent 22%)}
.login.out{animation:loginOut .6s ease-in both}
@keyframes loginIn{from{transform:translateX(100%)}to{transform:none}}@keyframes loginOut{to{transform:translateX(-100%)}}
.lcard{position:relative;width:min(410px,100%);padding:26px 20px;text-align:center;border:1px solid #e10600aa;border-radius:20px;background:linear-gradient(160deg,#220000,#0e0e10 55%);box-shadow:0 0 80px #e1060050}
.lcard img{width:80px;border-radius:19px;box-shadow:0 0 35px #e1060070}.lcard p{font-size:12px;color:var(--muted);margin-top:5px}
.tabs{display:flex;justify-content:center;gap:8px;margin:15px 0}.lcard form{text-align:start}.lcard .btn{width:100%;margin-top:14px}
.lerr{color:#ff8178;font-size:12px;min-height:19px;margin-top:8px}
#toast{position:fixed;z-index:80;bottom:calc(26px + env(safe-area-inset-bottom,0));inset-inline:0;margin:auto;width:max-content;max-width:92vw;padding:11px 18px;background:#fff;color:#111;border-bottom:3px solid var(--red);border-radius:10px;font-size:14px;opacity:0;transform:translateY(40px) skewX(-4deg);pointer-events:none;transition:opacity .35s,transform .45s var(--ease)}
#toast.on{opacity:1;transform:none}
@media(max-width:420px){.th{width:84px}.brand b{font-size:20px}}
@media(prefers-reduced-motion:reduce){.tag:before,.sk{animation:none}header:before{display:none}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></symbol>

function buildView(){seen.clear();const add='<div class="addbar"><button class="btn big" onclick="openAdd()">'+ic('plus')+' إضافة بث</button></div>';let h='';

function fillView(){const l=$('#list');if(!l)return;const fav=sharedSet('favorites'),tr=sharedSet('tracked');let arr=items,msg='';

/* ---------- matches & results (TheSportsDB) ---------- */
async function getEvents(kind,id){const k=kind+id,c=evCache[k];if(c&&Date.now()-c.t<600000)return c.d;const r=await fetch(API+(kind==='next'?'eventsnextleague':'eventspastleague')+'.php?id='+id);if(!r.ok)throw new Error('http');const j=await r.json();const d=j.events||[];evCache[k]={t:Date.now(),d};return d}

const fmt=d=>d?d.toLocaleString('ar',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
async function showEvents(kind,id,el,limit){if(!el)return;el.innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';try{let d=[...await getEvents(kind,id)].sort((a,b)=>((evTime(a)||0)-(evTime(b)||0))*(kind==='next'?1:-1));if(limit)d=d.slice(0,limit);if(!el.isConnected)return;if(!d.length){el.innerHTML='<div class="emptylist">لا توجد بيانات متاحة لهذا الدوري حالياً</div>';return}el.innerHTML='';d.forEach((e,i)=>el.appendChild(evCard(e,kind,i)))}catch(x){if(!el.isConnected)return;el.innerHTML='<div class="emptylist">تعذّر تحميل البيانات<button class="btn" id="retry">إعادة المحاولة</button></div>';$('#retry').onclick=()=>{delete evCache[kind+id];showEvents(kind,id,el,limit)}}}
function team(n,b){return '<div class="tm">'+(b?'<img loading="lazy" src="'+esc(b)+'/small" alt="" onerror="this.outerHTML=\'<div class=ph>⚽</div>\'">':'<div class="ph">⚽</div>')+'<span>'+esc(n)+'</span></div>'}
function evCard(e,kind,i){const d=document.createElement('article');d.className='mcard in';d.style.animationDelay=i*60+'ms';const t=evTime(e),past=kind==='past';const score=past&&e.intHomeScore!=null&&e.intHomeScore!==''?e.intHomeScore+' - '+e.intAwayScore:'VS';
const more=[e.strLeague,e.strRound?'الجولة '+e.strRound:'',e.strVenue?'الملعب: '+e.strVenue:'',e.strStatus&&e.strStatus!=='Not Started'?'الحالة: '+e.strStatus:'',e.strSeason?'الموسم '+e.strSeason:'',e.dateEvent||''].filter(Boolean);
d.innerHTML=team(e.strHomeTeam,e.strHomeTeamBadge)+'<div class="sc"><strong>'+esc(score)+'</strong><small>'+esc(fmt(t)||e.dateEvent||'')+'</small></div>'+team(e.strAwayTeam,e.strAwayTeamBadge)+'<div class="more">'+more.map(esc).join(' · ')+'</div>';d.onclick=()=>d.classList.toggle('open');return d}

/* ---------- prefs / items ---------- */
async function togglePref(kind,id){if(!user){toast('سجّل الدخول لحفظ تفضيلاتك');return}const a=new Set(prefs[kind]||[]);a.has(id)?a.delete(id):a.add(id);prefs[kind]=[...a];await safe(savePrefs);render();toast(a.has(id)?(kind==='favorites'?'أضيفت للمفضلة ★':'تمت إضافتها للمتابعة'):'تمت الإزالة')}
async function savePrefs(){const data={favorites:prefs.favorites||[],tracked:prefs.tracked||[],updatedAt:firebase.firestore.FieldValue.serverTimestamp()};await db.collection('users').doc(user.uid).set(data,{merge:true});if(family){await db.collection('families').doc(family.id).collection('memberPrefs').doc(user.uid).set({favorites:data.favorites,tracked:data.tracked,name:user.displayName||user.email},{merge:true});familyPrefs[user.uid]=data}}
function deleteItem(it,el){if(it.fixed||!user)return;el?.classList.add('gone');setTimeout(()=>db.collection('users').doc(user.uid).collection('matches').doc(it.id).delete().then(()=>toast('تم حذف البث')).catch(()=>{el?.classList.remove('gone');toast('تعذّر الحذف')}),330)}
function loadPublic(){fetch('matches.json',{cache:'no-cache'}).then(r=>r.json()).then(x=>{publicItems=Array.isArray(x)?x.filter(a=>a&&a.id&&a.url).map(a=>({...a,fixed:true})):[]}).catch(()=>{publicItems=[]}).finally(()=>{items=[...publicItems,...cloud];loadUserMatches()})}
async function loadUserMatches(){if(unsub){unsub();unsub=null}if(!user){items=[...publicItems];render();return}unsub=db.collection('users').doc(user.uid).collection('matches').orderBy('createdAt','desc').onSnapshot(sn=>{cloud=sn.docs.map(d=>({...d.data(),id:d.id,owner:user.uid}));items=[...publicItems,...cloud];render()},()=>{items=[...publicItems];render()})}

/* ---------- add dialog + preview ---------- */
function closeDlg(d){if(!d.open)return;d.classList.add('out');setTimeout(()=>{d.close();d.classList.remove('out')},240)}
$$('dialog').forEach(d=>{d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDlg(d)});d.addEventListener('cancel',e=>{e.preventDefault();closeDlg(d)});d.querySelectorAll('button[value=cancel]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();closeDlg(d)}))});
$('#familyForm').addEventListener('submit',e=>e.preventDefault());
let bulk=false;const pv={thumb:'',hls:null,timer:null};
function setTab(b){bulk=b;$('#pane-one').hidden=b;$('#pane-bulk').hidden=!b;$('#tab-one').classList.toggle('active',!b);$('#tab-bulk').classList.toggle('active',b);$('#f-title').required=$('#f-url').required=!b}
$('#tab-one').onclick=()=>setTab(false);$('#tab-bulk').onclick=()=>setTab(true);
function openAdd(){if(FB&&!user){toast('سجّل الدخول أولاً');return}setTab(false);pvReset(true);$('#matchDlg').showModal()}window.openAdd=openAdd;
function pvReset(msg){clearTimeout(pv.timer);if(pv.hls){pv.hls.destroy();pv.hls=null}pv.thumb='';$('#pvbox').innerHTML=msg?'<div class="pvmsg">أدخل رابط البث لتظهر المعاينة</div>':''}
$('#matchDlg').addEventListener('close',()=>pvReset(true));
$('#f-url').addEventListener('input',e=>{clearTimeout(pv.timer);const u=e.target.value.trim();pv.timer=setTimeout(()=>runPreview(u),550)});
function runPreview(u){pvReset(false);const box=$('#pvbox');if(!/^https?:\/\//i.test(u)){box.innerHTML='<div class="pvmsg">أدخل رابط البث لتظهر المعاينة</div>';return}
const yt=ytId(u);if(yt){pv.thumb='https://img.youtube.com/vi/'+yt+'/mqdefault.jpg';box.innerHTML='<img src="'+pv.thumb+'" alt="معاينة">';return}
if(isVid(u)){box.innerHTML='<div class="pvmsg">جارٍ تحميل المعاينة…</div>';const v=document.createElement('video');v.muted=true;v.playsInline=true;v.autoplay=true;v.preload='auto';v.style.cssText='opacity:0;transition:opacity .4s';box.appendChild(v);let done=false;
const fail=()=>{if(done)return;done=true;box.innerHTML='<div class="pvmsg">تعذّرت المعاينة (قد يمنع الخادم CORS). يمكنك الحفظ وتجربة الرابط.</div>'};const to=setTimeout(fail,15000);
v.addEventListener('playing',()=>{if(done)return;done=true;clearTimeout(to);box.querySelector('.pvmsg')?.remove();v.style.opacity=1;setTimeout(()=>{try{const c=document.createElement('canvas');c.width=320;c.height=180;c.getContext('2d').drawImage(v,0,0,320,180);pv.thumb=c.toDataURL('image/jpeg',.6)}catch(e){}},900)});
v.addEventListener('error',()=>{clearTimeout(to);fail()});
if(/\.m3u8/i.test(u)&&window.Hls&&Hls.isSupported()){pv.hls=new Hls();pv.hls.loadSource(u);pv.hls.attachMedia(v);pv.hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal){clearTimeout(to);fail()}})}else v.src=u;v.play().catch(()=>{});return}
box.innerHTML='<iframe src="'+esc(u)+'" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>'}
const nameFrom=u=>{try{const x=new URL(u);return (x.pathname.split('/').filter(Boolean).pop()||x.host).slice(0,40)}catch(e){return u.slice(0,40)}};
function parseM3U(t){const out=[];let m=null;t.split(/\r?\n/).forEach(x=>{x=x.trim();if(x.startsWith('#EXTINF')){m={title:(x.split(',').slice(1).join(',')||'').trim(),league:(x.match(/group-title="([^"]*)"/)||[])[1]||'',thumb:(x.match(/tvg-logo="([^"]*)"/)||[])[1]||''}}else if(/^https?:\/\//i.test(x)){out.push({title:m?.title||nameFrom(x),league:m?.league||'',thumb:m?.thumb||'',url:x});m=null}});return out}
function parseBulk(t){if(/#EXTM3U|#EXTINF/i.test(t))return parseM3U(t);return t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.split('|').map(x=>x.trim());const u=p.find(x=>/^https?:\/\//i.test(x));if(!u)return null;const r=p.filter(x=>x!==u);return{title:r[0]||nameFrom(u),league:r[1]||'',url:u}}).filter(Boolean)}
$('#f-m3u').onchange=async e=>{const f=e.target.files[0];if(f){$('#bulkText').value=await f.text();toast('تم تحميل الملف، اضغط حفظ')}};
$('#m3uGo').onclick=async()=>{const u=$('#m3uUrl').value.trim();if(!/^https?:\/\//i.test(u)){toast('أدخل رابط قائمة صالح');return}try{const r=await fetch(u);if(!r.ok)throw 0;$('#bulkText').value=await r.text();toast('تم جلب القائمة، اضغط حفظ')}catch(e){toast('تعذّر جلب القائمة (قد يمنع الخادم CORS). حمّل الملف وارفعه بدلاً من ذلك')}};
$('#matchForm').onsubmit=async e=>{e.preventDefault();if(e.submitter?.value!=='ok')return;if(!user){toast('سجّل الدخول أولاً');return}
let list;if(bulk){list=parseBulk($('#bulkText').value);if(!list.length){toast('لم أجد روابط صالحة');return}}else list=[{title:$('#f-title').value.trim(),league:$('#f-league').value.trim(),url:$('#f-url').value.trim(),thumb:pv.thumb}];
try{const coll=db.collection('users').doc(user.uid).collection('matches');for(let i=0;i<list.length;i+=400){const b=db.batch();list.slice(i,i+400).forEach(x=>{const d={title:x.title,league:x.league||'',url:x.url,createdAt:firebase.firestore.FieldValue.serverTimestamp()};if(x.thumb&&x.thumb.length<150000)d.thumb=x.thumb;b.set(coll.doc(),d)});await b.commit()}
closeDlg($('#matchDlg'));e.target.reset();$('#bulkText').value='';toast('تمت إضافة '+list.length+' بث ✓')}catch(x){console.error(x);toast('تعذّرت الإضافة: انشر قواعد Firestore الجديدة')}};

/* ---------- family ---------- */
function familyUI(){const body=$('#familyBody');if(!family){body.innerHTML='<p class="muted" style="margin-top:12px">أنشئ عائلة لمشاركة المفضلات والمتابعة، أو انضم باستخدام رمز الدعوة.</p><label>اسم العائلة</label><input id="newFamilyName" class="rtl" placeholder="عائلتي"><div class="row"><button type="button" class="btn" id="createFamily">إنشاء عائلة</button></div><hr style="border-color:var(--line);margin:18px 0"><label>رمز الدعوة</label><input id="joinCode" placeholder="مثال: A7K2Q9"><div class="row"><button type="button" class="btn ghost" id="joinFamily">انضمام</button></div>';$('#createFamily').onclick=()=>safe(createFamily);$('#joinFamily').onclick=()=>safe(joinFamily);return}
const ms=Object.entries(family.members||{});body.innerHTML='<p class="muted" style="margin-top:10px">تُشارك العائلة المفضلات والمتابعة فقط، ولا تشارك روابط الحساب الخاصة.</p><div class="code">'+esc(family.inviteCode)+'</div><p class="muted" style="text-align:center;font-size:11px">شارك الرمز مع أفراد عائلتك</p><h2>الأعضاء ('+ms.length+')</h2><div>'+ms.map(([id,m])=>'<div class="member"><div><strong>'+esc(m.name||m.email)+'</strong><small>'+esc(m.email||'')+' · '+(m.role==='owner'?'المالك':'عضو')+'</small></div>'+(family.ownerId===user.uid&&id!==user.uid?'<button type="button" class="btn ghost removeMember" data-id="'+esc(id)+'">إزالة</button>':'')+'</div>').join('')+'</div><div class="row"><button type="button" class="btn ghost" id="leaveFamily">'+(family.ownerId===user.uid?'حذف العائلة':'مغادرة العائلة')+'</button></div>';
body.querySelectorAll('.removeMember').forEach(b=>b.onclick=()=>safe(()=>removeMember(b.dataset.id)));$('#leaveFamily').onclick=()=>safe(leaveFamily)}
async function createFamily(){const name=$('#newFamilyName').value.trim()||'عائلتي',id=db.collection('families').doc().id,code=Math.random().toString(36).slice(2,8).toUpperCase();family={id,name,inviteCode:code,ownerId:user.uid,memberIds:[user.uid],members:{[user.uid]:{name:user.displayName||'',email:user.email,role:'owner'}}};const b=db.batch();b.set(db.collection('families').doc(id),family);b.set(db.collection('familyInvites').doc(code),{familyId:id,name,ownerId:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await b.commit();await db.collection('users').doc(user.uid).set({familyId:id},{merge:true});await loadFamily();closeDlg($('#familyDlg'));toast('تم إنشاء العائلة')}
async function joinFamily(){const code=$('#joinCode').value.trim().toUpperCase(),inv=await db.collection('familyInvites').doc(code).get();if(!inv.exists){toast('رمز الدعوة غير صحيح');return}const fid=inv.data().familyId;await db.collection('families').doc(fid).update({memberIds:firebase.firestore.FieldValue.arrayUnion(user.uid),['members.'+user.uid]:{name:user.displayName||'',email:user.email,role:'member'}});await db.collection('users').doc(user.uid).set({familyId:fid},{merge:true});await loadFamily();closeDlg($('#familyDlg'));toast('انضممت إلى العائلة')}
async function removeMember(id){if(!family||family.ownerId!==user.uid)return;const m={...family.members};delete m[id];await db.collection('families').doc(family.id).update({members:m,memberIds:(family.memberIds||Object.keys(m)).filter(x=>x!==id)});toast('تمت إزالة العضو');await loadFamily();familyUI()}
async function leaveFamily(){if(!family)return;if(family.ownerId===user.uid){const b=db.batch();b.delete(db.collection('families').doc(family.id));b.delete(db.collection('familyInvites').doc(family.inviteCode));await b.commit()}else{const m={...family.members};delete m[user.uid];await db.collection('families').doc(family.id).update({members:m,memberIds:(family.memberIds||Object.keys(m)).filter(x=>x!==user.uid)})}await db.collection('users').doc(user.uid).set({familyId:null},{merge:true});family=null;familyPrefs={};closeDlg($('#familyDlg'));toast('تم تحديث العائلة');renderProfile();render()}
async function loadFamily(){if(!user)return;const ud=await db.collection('users').doc(user.uid).get(),data=ud.data()||{};prefs={favorites:data.favorites||[],tracked:data.tracked||[]};family=null;familyPrefs={};if(data.familyId)try{const fd=await db.collection('families').doc(data.familyId).get();if(fd.exists){family={id:fd.id,...fd.data()};const ss=await db.collection('families').doc(fd.id).collection('memberPrefs').get();ss.forEach(x=>familyPrefs[x.id]=x.data())}}catch(e){family=null;familyPrefs={};console.warn(e)}renderProfile();render()}
function renderProfile(){const p=$('#profile');p.hidden=!user;if(user)p.textContent=initials();updateDrawer()}

/* ---------- auth ---------- */
function showLogin(){const o=$('#login');o.classList.remove('out');o.hidden=false}
function hideLogin(){const o=$('#login');if(o.hidden)return;o.classList.add('out');setTimeout(()=>{if(o.classList.contains('out'))o.hidden=true},620)}
function leaveApp(){closeDrawer();const a=$('#app');a.classList.add('leaving');setTimeout(()=>auth.signOut().finally(()=>a.classList.remove('leaving')),440)}
function authUI(){if(!FB){renderProfile();loadPublic();return}showLogin();firebase.initializeApp(SPOT_FIREBASE);auth=firebase.auth();db=firebase.firestore();let mode='in';
const ERR={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/invalid-email':'البريد الإلكتروني غير صالح','auth/email-already-in-use':'هذا البريد مسجّل مسبقاً','auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)','auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً','auth/network-request-failed':'تحقق من الاتصال بالإنترنت','auth/unauthorized-domain':'أضف نطاق الموقع في Authorized domains','auth/missing-email':'اكتب بريدك أولاً','auth/user-not-found':'لا يوجد حساب بهذا البريد','auth/operation-not-allowed':'فعّل Email/Password من Firebase Authentication','auth/missing-password':'اكتب كلمة المرور'};
const err=x=>$('#lerr').textContent=ERR[x.code]||'حدث خطأ، حاول مرة أخرى';
const set=m=>{mode=m;$('#lname-w').hidden=m!=='up';$('#lgo').textContent=m==='up'?'إنشاء الحساب':'دخول';$('#ltab-in').classList.toggle('active',m==='in');$('#ltab-up').classList.toggle('active',m==='up');$('#lerr').textContent=''};
$('#ltab-in').onclick=()=>set('in');$('#ltab-up').onclick=()=>set('up');
$('#lform').onsubmit=async e=>{e.preventDefault();try{if(mode==='up'){const c=await auth.createUserWithEmailAndPassword($('#lemail').value.trim(),$('#lpass').value);const n=$('#lname').value.trim();if(n){await c.user.updateProfile({displayName:n});renderProfile()}await db.collection('users').doc(c.user.uid).set({name:n,email:c.user.email,favorites:[],tracked:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()})}else await auth.signInWithEmailAndPassword($('#lemail').value.trim(),$('#lpass').value)}catch(x){err(x)}};
$('#lforgot').onclick=async()=>{if(!$('#lemail').value.trim()){$('#lerr').textContent='اكتب بريدك أولاً';return}try{await auth.sendPasswordResetEmail($('#lemail').value.trim());toast('أرسلنا رابط إعادة التعيين لبريدك')}catch(x){err(x)}};
auth.onAuthStateChanged(async u=>{user=u;if(!u){if(unsub){unsub();unsub=null}stopPlayer();current=null;togglePlayer();family=null;familyPrefs={};prefs={favorites:[],tracked:[]};cloud=[];items=[...publicItems];showLogin();renderProfile();render()}else{hideLogin();await loadFamily();loadPublic()}})}

buildDrawer();$('#stage').innerHTML=EMPTY;$('#now').innerHTML='<span class="muted">اختر بثاً من القائمة لبدء المشاهدة</span>';render();authUI();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
