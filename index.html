const $=s=>document.querySelector(s), main=$('#main'), toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('on'),2800)};
const EMPTY='<div class="empty"><img src="icon-512.png" alt="SPOT"><span>اختر مباراة من القائمة لبدء المشاهدة</span></div>', DEMO=[{id:'demo',title:'بث تجريبي (Mux)',league:'اختبار المشغّل',url:'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',fixed:true}];
let auth,db,user=null,items=[],prefs={favorites:[],tracked:[]},family=null,familyPrefs={},cloud=[],publicItems=[...DEMO],built=null,seen=new Set(),view='home',filter='all',current=null,hls=null,unsub=null;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function initials(){return (user?.displayName||user?.email||'؟').trim().slice(0,1).toUpperCase()}
function sharedSet(kind){const out=new Set(prefs[kind]||[]);if(family)Object.values(familyPrefs).forEach(p=>(p[kind]||[]).forEach(id=>out.add(id)));return out}
function render(){const fav=sharedSet('favorites'),track=sharedSet('tracked');$('#favCount').textContent=fav.size?'('+fav.size+')':'';$('#trackCount').textContent=track.size?'('+track.size+')':'';if(built!==view){buildView();built=view}renderList(fav,track)}
function buildView(){seen.clear();if(view==='home'){main.innerHTML='<section class="page"><div class="addbar"><button class="btn big" id="add">＋ إضافة مباراة</button></div><h2>المباريات</h2><div class="chips" id="chips"></div><div class="list" id="list"></div><p class="note">أضف روابط البث التي لديك حق مشاهدتها. سبوت مشغّل فقط ولا يوفّر قنوات أو بثوثاً. المفضلات والمتابعة تتزامن مع حسابك ويمكن مشاركتها مع العائلة.</p></section>';$('#add').onclick=()=>$('#matchDlg').showModal()}else main.innerHTML='<section class="page"><h2>'+(view==='favorites'?'المباريات المفضلة':'ما تتابعه')+'</h2><div class="list" id="list"></div></section>'}
function renderList(fav,track){const l=$('#list');if(!l)return;l.innerHTML='';const leagues=[...new Set(items.map(x=>x.league).filter(Boolean))];if(filter!=='all'&&!leagues.includes(filter))filter='all';const ch=$('#chips');if(ch){ch.innerHTML='';ch.style.display=leagues.length>1?'flex':'none';['all',...leagues].forEach(x=>{const b=document.createElement('button');b.className='chip '+(filter===x?'active':'');b.textContent=x==='all'?'الكل':x;b.onclick=()=>{filter=x;render()};ch.appendChild(b)})}
const set=view==='favorites'?fav:view==='tracked'?track:null;const shown=items.filter(x=>(!set||set.has(x.id))&&(view!=='home'||filter==='all'||x.league===filter));

shown.forEach((it,i)=>{const b=document.createElement('article');b.className='item'+(current===it.id?' current':'')+(seen.has(it.id)?'':' in');b.style.animationDelay=i*70+'ms';b.tabIndex=0;b.setAttribute('role','button');b.innerHTML='<span class="tag">مباشر</span><div class="t"><b>'+esc(it.title)+'</b><span>'+esc(it.league||'بدون بطولة')+'</span></div><button class="mini '+(fav.has(it.id)?'on':'')+'" title="مفضلة">★</button><button class="mini '+(track.has(it.id)?'on':'')+'" title="متابعة">◉</button><button class="mini del" title="حذف">×</button>';b.onclick=()=>play(it.id);b.onkeydown=e=>{if(e.target===b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();play(it.id)}};const bs=b.querySelectorAll('.mini');bs[0].onclick=e=>{e.stopPropagation();togglePref('favorites',it.id)};bs[1].onclick=e=>{e.stopPropagation();togglePref('tracked',it.id)};bs[2].onclick=e=>{e.stopPropagation();deleteItem(it)};if(it.fixed)bs[2].remove();l.appendChild(b);seen.add(it.id)})}

const toEmbed=u=>{const m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|live\/|embed\/)|youtu\.be\/)([\w-]{11})/);return m?'https://www.youtube.com/embed/'+m[1]+'?autoplay=1&playsinline=1&rel=0':u};

if(/\.(m3u8|mp4|webm|mpd)(\?|#|$)/i.test(it.url)){const v=document.createElement('video');v.controls=true;v.autoplay=true;v.playsInline=true;st.appendChild(v);if(/\.m3u8/i.test(it.url)&&window.Hls&&Hls.isSupported()){hls=new Hls({lowLatencyMode:true});hls.loadSource(it.url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)toast('تعذّر تشغيل الرابط، تحقق من CORS أو الرابط')})}else{v.src=it.url;v.onerror=()=>toast('تعذّر تشغيل البث')}v.play().catch(()=>{})}
else{const f=document.createElement('iframe');f.src=toEmbed(it.url);f.allow='autoplay;fullscreen;picture-in-picture;encrypted-media';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';st.appendChild(f)}

$('#familyForm').addEventListener('submit',e=>e.preventDefault());
$('#f-m3u').onchange=e=>{const has=!!e.target.files[0];$('#f-title').required=$('#f-url').required=!has};
$('#matchForm').onsubmit=async e=>{e.preventDefault();if(e.submitter?.value!=='ok')return;if(!user){toast('سجّل الدخول أولاً');return}const file=$('#f-m3u').files[0];const list=file?parseM3U(await file.text()):[{title:$('#f-title').value.trim(),league:$('#f-league').value.trim(),url:$('#f-url').value.trim()}];if(!list.length){toast('لم أجد روابط في الملف');return}try{const batch=db.batch();list.forEach(x=>{const ref=db.collection('users').doc(user.uid).collection('matches').doc();batch.set(ref,{...x,createdAt:firebase.firestore.FieldValue.serverTimestamp()})});await batch.commit();closeDlg($('#matchDlg'));e.target.reset();$('#f-title').required=$('#f-url').required=true;toast('تمت إضافة '+list.length+' مباراة ✓')}catch(x){console.error(x);toast('تعذّرت الإضافة: انشر قواعد Firestore الجديدة')}};
function familyUI(){const body=$('#familyBody');if(!family){body.innerHTML='<p class="muted" style="margin-top:12px">أنشئ عائلة لمشاركة المفضلات والمتابعة، أو انضم باستخدام رمز الدعوة.</p><label>اسم العائلة</label><input id="newFamilyName" class="rtl" placeholder="عائلتي"><button type="button" class="btn" id="createFamily" style="margin-top:13px">إنشاء عائلة</button><hr style="border-color:var(--line);margin:18px 0"><label>رمز الدعوة</label><input id="joinCode" placeholder="مثال: A7K2Q9"><button type="button" class="btn ghost" id="joinFamily" style="margin-top:13px">انضمام</button>';$('#createFamily').onclick=()=>safe(createFamily);$('#joinFamily').onclick=()=>safe(joinFamily);return}const members=Object.entries(family.members||{});body.innerHTML='<p class="muted" style="margin-top:10px">تُشارك العائلة المفضلات والمتابعة فقط، ولا تشارك روابط الحساب الخاصة.</p><div class="code">'+esc(family.inviteCode)+'</div><p class="muted" style="text-align:center;font-size:11px">شارك الرمز مع أفراد عائلتك</p><h2>الأعضاء ('+members.length+')</h2><div>'+members.map(([id,m])=>'<div class="member"><div><strong>'+esc(m.name||m.email)+'</strong><small>'+esc(m.email||'')+' · '+(m.role==='owner'?'المالك':'عضو')+'</small></div>'+(family.ownerId===user.uid&&id!==user.uid?'<button type="button" class="btn ghost removeMember" data-id="'+id+'">إزالة</button>':'')+'</div>').join('')+'</div><button type="button" class="btn ghost" id="leaveFamily" style="margin-top:15px">'+(family.ownerId===user.uid?'حذف العائلة':'مغادرة العائلة')+'</button>';body.querySelectorAll('.removeMember').forEach(b=>b.onclick=()=>safe(()=>removeMember(b.dataset.id)));$('#leaveFamily').onclick=()=>safe(leaveFamily)}
$('#familyBtn').onclick=()=>{$('#familyDlg').showModal();familyUI()};
async function createFamily(){const name=$('#newFamilyName').value.trim()||'عائلتي',id=db.collection('families').doc().id,code=Math.random().toString(36).slice(2,8).toUpperCase();family={id,name,inviteCode:code,ownerId:user.uid,memberIds:[user.uid],members:{[user.uid]:{name:user.displayName||'',email:user.email,role:'owner'}}};const batch=db.batch();batch.set(db.collection('families').doc(id),family);batch.set(db.collection('familyInvites').doc(code),{familyId:id,name,ownerId:user.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await batch.commit();await db.collection('users').doc(user.uid).set({familyId:id},{merge:true});await loadFamily();$('#familyDlg').close();toast('تم إنشاء العائلة')}
async function joinFamily(){const code=$('#joinCode').value.trim().toUpperCase(),invite=await db.collection('familyInvites').doc(code).get();if(!invite.exists){toast('رمز الدعوة غير صحيح');return}const fid=invite.data().familyId,ref=db.collection('families').doc(fid);await ref.update({memberIds:firebase.firestore.FieldValue.arrayUnion(user.uid),['members.'+user.uid]:{name:user.displayName||'',email:user.email,role:'member'}});await db.collection('users').doc(user.uid).set({familyId:fid},{merge:true});await loadFamily();$('#familyDlg').close();toast('انضممت إلى العائلة')}
async function removeMember(id){if(!family||family.ownerId!==user.uid)return;const m={...family.members};delete m[id];await db.collection('families').doc(family.id).update({members:m,memberIds:(family.memberIds||Object.keys(m)).filter(x=>x!==id)});toast('تمت إزالة العضو');loadFamily()}
async function leaveFamily(){if(!family)return;if(family.ownerId===user.uid){const batch=db.batch();batch.delete(db.collection('families').doc(family.id));batch.delete(db.collection('familyInvites').doc(family.inviteCode));await batch.commit()}else{const m={...family.members};delete m[user.uid];await db.collection('families').doc(family.id).update({members:m,memberIds:(family.memberIds||Object.keys(m)).filter(x=>x!==user.uid)})}await db.collection('users').doc(user.uid).set({familyId:null},{merge:true});family=null;$('#familyDlg').close();toast('تم تحديث العائلة');renderProfile()}
async function loadFamily(){if(!user)return;const ud=await db.collection('users').doc(user.uid).get(),data=ud.data()||{};prefs={favorites:data.favorites||[],tracked:data.tracked||[]};family=null;familyPrefs={};if(data.familyId)try{const fd=await db.collection('families').doc(data.familyId).get();if(fd.exists){family={id:fd.id,...fd.data()};const ss=await db.collection('families').doc(fd.id).collection('memberPrefs').get();ss.forEach(x=>familyPrefs[x.id]=x.data())}}catch(e){family=null;familyPrefs={};console.warn(e)}renderProfile();render()}
function renderProfile(){if(!user){$('#profile').hidden=true;$('#familyBtn').hidden=true;$('#logout').hidden=true;return}$('#profile').hidden=false;$('#profile').innerHTML='<span class="avatar">'+initials()+'</span><span>'+esc(user.displayName||user.email.split('@')[0])+'</span>';$('#familyBtn').hidden=false;$('#logout').hidden=false}
function loadPublic(){fetch('matches.json',{cache:'no-cache'}).then(r=>r.json()).then(x=>{publicItems=[...DEMO,...(Array.isArray(x)?x.filter(a=>a&&a.id&&a.id!=='demo').map(a=>({...a,fixed:true})):[])]}).catch(()=>{publicItems=[...DEMO]}).finally(()=>{items=[...publicItems,...cloud];loadUserMatches()})}
async function loadUserMatches(){if(unsub){unsub();unsub=null}if(!user){items=[...publicItems];render();return}unsub=db.collection('users').doc(user.uid).collection('matches').orderBy('createdAt','desc').onSnapshot(sn=>{cloud=sn.docs.map(d=>({...d.data(),id:d.id,owner:user.uid}));items=[...publicItems,...cloud];render()},()=>{items=[...publicItems];render()})}
function authUI(){const ov=$('#login');if(!FB){renderProfile();loadPublic();return}ov.hidden=false;firebase.initializeApp(SPOT_FIREBASE);auth=firebase.auth();db=firebase.firestore();let mode='in';const ERR={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/invalid-email':'البريد الإلكتروني غير صالح','auth/email-already-in-use':'هذا البريد مسجّل مسبقاً','auth/weak-password':'كلمة المرور ضعيفة (6 أحرف على الأقل)','auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً','auth/network-request-failed':'تحقق من الاتصال بالإنترنت','auth/unauthorized-domain':'أضف نطاق الموقع في Authorized domains','auth/missing-email':'اكتب بريدك أولاً','auth/user-not-found':'لا يوجد حساب بهذا البريد','auth/operation-not-allowed':'فعّل Email/Password من Firebase Authentication','auth/missing-password':'اكتب كلمة المرور'};const err=x=>$('#lerr').textContent=ERR[x.code]||'حدث خطأ، حاول مرة أخرى';const set=m=>{mode=m;$('#lname-w').hidden=m!=='up';$('#lgo').textContent=m==='up'?'إنشاء الحساب':'دخول';$('#ltab-in').classList.toggle('active',m==='in');$('#ltab-up').classList.toggle('active',m==='up');$('#lerr').textContent=''};$('#ltab-in').onclick=()=>set('in');$('#ltab-up').onclick=()=>set('up');$('#lform').onsubmit=async e=>{e.preventDefault();try{if(mode==='up'){const c=await auth.createUserWithEmailAndPassword($('#lemail').value.trim(),$('#lpass').value);const n=$('#lname').value.trim();if(n){await c.user.updateProfile({displayName:n});renderProfile()}await db.collection('users').doc(c.user.uid).set({name:n,email:c.user.email,favorites:[],tracked:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()})}else await auth.signInWithEmailAndPassword($('#lemail').value.trim(),$('#lpass').value)}catch(x){err(x)}};$('#lforgot').onclick=async()=>{if(!$('#lemail').value.trim()){$('#lerr').textContent='اكتب بريدك أولاً';return}try{await auth.sendPasswordResetEmail($('#lemail').value.trim());toast('أرسلنا رابط إعادة التعيين لبريدك')}catch(x){err(x)}};$('#logout').onclick=()=>auth.signOut();auth.onAuthStateChanged(async u=>{user=u;if(!u){ov.hidden=false;if(unsub){unsub();unsub=null}stopPlayer();current=null;family=null;familyPrefs={};prefs={favorites:[],tracked:[]};cloud=[];items=[...publicItems];renderProfile();render()}else{ov.hidden=true;await loadFamily();loadPublic()}})}
$('#stage').innerHTML=EMPTY;$('#now').innerHTML='<span class="muted">اختر مباراة من القائمة لبدء المشاهدة</span>';
authUI();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
